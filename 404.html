  @font-face{font-family:"Unbounded";font-weight:800;font-display:swap;src:url(/fonts/unbounded-800.woff2) format("woff2")}
  @font-face{font-family:"DM Sans";font-weight:100 1000;font-display:swap;src:url(/fonts/dm-sans.woff2) format("woff2")}
  :root{--bleu:#0055A4;--nuit:#002654;--rouge:#EF4135}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{background:var(--bleu);color:#fff;font:400 17px/1.5 "DM Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 20px}
  .n{font:800 13px/1 "Unbounded",sans-serif;letter-spacing:.14em;opacity:.7}
  h1{margin-top:14px;font:800 clamp(56px,16vw,200px)/.95 "Unbounded",sans-serif;text-transform:uppercase;letter-spacing:-.02em}
  p{margin-top:18px;font-size:clamp(17px,2vw,22px);max-width:30ch}
  p[lang="sv"]{margin-top:6px;opacity:.7;font-size:16px}
  a{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:52px;margin-top:32px;padding:0 26px;border-radius:99px;background:#fff;color:var(--bleu);font:800 13px/1 "Unbounded",sans-serif;text-transform:uppercase;text-decoration:none;transition:transform .2s,box-shadow .2s}
  a:hover{transform:translateY(-2px) rotate(-2deg);box-shadow:0 6px 0 var(--nuit)}
  a:focus-visible{outline:3px solid var(--rouge);outline-offset:3px}
  .piste{position:relative;height:150px;margin-bottom:max(28px,env(safe-area-inset-bottom))}
  .piste::before{content:"";position:absolute;left:0;right:0;bottom:5px;height:4px;border-radius:9px;background:#fff}
  .coureur{position:absolute;left:0;bottom:0;width:120px;animation:course 3.2s linear infinite}
  .coureur svg{display:block;width:120px;height:auto;overflow:visible;animation:trot .21s ease-in-out infinite alternate;transform-origin:50% 94%}
  @keyframes course{from{transform:translateX(-140px)}to{transform:translateX(100vw)}}
  @keyframes trot{to{transform:translateY(-8%) rotate(-6deg)}}
  @media (min-width:960px){main{padding:56px}.piste{height:190px}.coureur,.coureur svg{width:160px}@keyframes course{from{transform:translateX(-180px)}to{transform:translateX(100vw)}}}
  @media (prefers-reduced-motion:reduce){.coureur{animation:none;left:50%;transform:translateX(-50%)}.coureur svg{animation:none}}
