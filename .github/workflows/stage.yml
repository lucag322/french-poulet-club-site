# Branche stage : publie le site sur stage.frenchpouletclub.com (dépôt french-poulet-club-stage).
# Le site de test n'est pas indexé par les moteurs de recherche.
name: Stage

on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: stage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          DOMAIN="${{ vars.STAGE_DOMAIN }}"
          python3 build.py --out dist --stage \
            --site "https://${DOMAIN:-lucag322.github.io/french-poulet-club-stage}" \
            ${DOMAIN:+--cname "$DOMAIN"}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGE_DEPLOY_KEY }}
          external_repository: lucag322/french-poulet-club-stage
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Stage ${{ github.sha }}"
