# Branche main : publie le site en production sur GitHub Pages de ce dépôt.
# Inactif tant que la variable de dépôt PROD_DOMAIN n'est pas définie (ex. frenchpouletclub.com).
name: Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PROD_DOMAIN != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir dist
          cp -R index.html favicon.svg fonts img dist/
          echo "${{ vars.PROD_DOMAIN }}" > dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
